<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoom Drive</title>
<meta name="description" content="Dodge the traffic and grab the coins in this tiny browser game. No install, just play.">
<meta name="theme-color" content="#FFF7EA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --mint:#8FD9A8;
    --mint-deep:#6BC48A;
    --road:#59637A;
    --road-dark:#4B5468;
    --dash:#FFF1C1;
    --cream:#FFF7EA;
    --ink:#2A3145;
    --sun:#FFD23F;
    --coral:#FF7A6B;
    --sky:#BFE8FF;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:
      radial-gradient(circle at 12% 8%, #FFFFFF 0 3px, transparent 3px) 0 0/26px 26px,
      var(--mint);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
  }

  .cabinet{
    width:100%;
    max-width:392px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:28px;
    box-shadow:8px 8px 0 var(--ink);
    padding:14px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:2px 4px 14px;
  }
  .ttl{min-width:0}
  h1{margin:0 0 3px;font-size:22px;font-weight:900;letter-spacing:-0.03em;word-break:keep-all}
  h1 span{color:var(--coral)}
  .tag{font-size:12px;font-weight:700;color:#7A8296;letter-spacing:-0.01em;line-height:1.45}

  .lang{
    flex:none;
    font-family:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#fff;
    border:3px solid var(--ink);border-radius:12px;
    padding:7px 8px;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
  }
  .lang:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

  .hud{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:12px;
  }
  .hud div{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:6px 8px 7px;
    text-align:center;
  }
  .hud b{
    display:block;
    font-size:11px;
    font-weight:800;
    color:#7A8296;
    letter-spacing:0.02em;
  }
  .hud i{
    display:block;
    font-style:normal;
    font-size:19px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.02em;
  }

  .stage{position:relative}
  canvas{
    display:block;
    width:100%;
    aspect-ratio:360/620;
    border:4px solid var(--ink);
    border-radius:20px;
    background:var(--mint-deep);
    touch-action:none;
    cursor:pointer;
  }

  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:24px;
    text-align:center;
    border-radius:20px;
    background:rgba(42,49,69,.62);
    backdrop-filter:blur(2px);
  }
  .screen.on{display:flex}
  .card{
    width:100%;
    max-width:250px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:22px;
    box-shadow:6px 6px 0 rgba(0,0,0,.28);
    padding:20px 18px;
  }
  .card h2{
    margin:0 0 6px;
    font-size:26px;
    font-weight:900;
    letter-spacing:-0.04em;
  }
  .card p{
    margin:0 0 14px;
    font-size:13px;
    line-height:1.55;
    color:#5C6479;
    font-weight:600;
  }
  .result{
    display:flex;
    justify-content:center;
    gap:18px;
    margin:2px 0 14px;
  }
  .result span{font-size:12px;font-weight:800;color:#7A8296;display:block}
  .result strong{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}

  button{
    font-family:inherit;
    font-weight:900;
    font-size:16px;
    letter-spacing:-0.02em;
    color:var(--ink);
    background:var(--sun);
    border:3px solid var(--ink);
    border-radius:14px;
    padding:11px 22px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .06s, box-shadow .06s;
  }
  button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

  .pad{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .pad button{
    flex:1;
    background:#fff;
    font-size:22px;
    padding:12px 0;
  }
  .help{
    margin:10px 2px 0;
    font-size:12px;
    line-height:1.6;
    font-weight:600;
    color:#7A8296;
    text-align:center;
  }

  .backwrap{margin:12px 0 0;text-align:center}
  .back{font-size:12px;font-weight:800;color:#7A8296;text-decoration:none}
  .back:hover{color:var(--ink)}

  @media (hover:hover){
    .pad{display:none}
  }
</style>
</head>
<body>

<div class="cabinet">
  <header>
    <div class="ttl">
      <h1 id="gameName">Zoom <span>Drive</span></h1>
      <div class="tag" data-i18n="tagline">Dodge cars, grab coins.</div>
    </div>
    <select id="lang" aria-label="Language" class="lang"></select>
  </header>

  <div class="hud">
    <div><b data-i18n="dist">Dist</b><i id="hDist">0</i></div>
    <div><b data-i18n="coin">Coins</b><i id="hCoin">0</i></div>
    <div><b data-i18n="best">Best</b><i id="hBest">0</i></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>

    <div class="screen on" id="scReady">
      <div class="card">
        <h2 data-i18n="readyTitle">Ready?</h2>
        <p data-i18n-html="readyBody">Dodge the oncoming cars<br>and grab coins to score points.</p>
        <button id="btnStart" data-i18n="start">Start</button>
      </div>
    </div>

    <div class="screen" id="scOver">
      <div class="card">
        <h2 data-i18n="overTitle">Crash!</h2>
        <div class="result">
          <div><span data-i18n="dist">Dist</span><strong id="rDist">0</strong></div>
          <div><span data-i18n="coin">Coins</span><strong id="rCoin">0</strong></div>
        </div>
        <button id="btnRetry" data-i18n="retry">Play Again</button>
      </div>
    </div>

    <div class="screen" id="scPause">
      <div class="card">
        <h2 data-i18n="paused">Paused</h2>
        <p data-i18n="pausedHint">Press P again to keep going.</p>
        <button id="btnResume" data-i18n="resume">Resume</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button id="padL" aria-label="Left">◀</button>
    <button id="padR" aria-label="Right">▶</button>
  </div>

  <p class="help" data-i18n="help">Hold ← → · Tap left or right on screen · P to pause</p>

  <p class="backwrap"><a class="back" id="back" href="/">‹ <span data-i18n="allGames">All games</span></a></p>
</div>

<script>
(() => {
  // ── 언어 ────────────────────────────────────────────
  const LANGS = ['en','ko','ja','es','fr','zh'];
  const LANG_NAME = {
    en:'English', ko:'한국어', ja:'日本語',
    es:'Español', fr:'Français', zh:'中文'
  };

  const STR = {
    en: {
      name1:'Zoom', name2:'Drive',
      tagline:'Dodge cars, grab coins.',
      dist:'Dist', coin:'Coins', best:'Best',
      readyTitle:'Ready?',
      readyBody:'Dodge the oncoming cars<br>and grab coins to score points.',
      start:'Start',
      overTitle:'Crash!',
      retry:'Play Again',
      paused:'Paused',
      pausedHint:'Press P again to keep going.',
      resume:'Resume',
      padLeft:'Left', padRight:'Right',
      help:'Hold ← → · Tap left or right on screen · P to pause',
      allGames:'All games',
      coinPop:'+{n}'
    },
    ko: {
      name1:'붕붕', name2:'드라이브',
      tagline:'차 피하고 동전 줍기',
      dist:'거리', coin:'동전', best:'최고',
      readyTitle:'준비됐나요?',
      readyBody:'마주 오는 차를 피하고<br>동전을 주우면 점수가 올라가요.',
      start:'시작',
      overTitle:'쿵!',
      retry:'다시 하기',
      paused:'잠깐 멈춤',
      pausedHint:'P 키를 다시 누르면 이어서 해요.',
      resume:'이어 하기',
      padLeft:'왼쪽으로', padRight:'오른쪽으로',
      help:'← → 키 · 화면 왼쪽 오른쪽 누르기 · P 키로 멈춤',
      allGames:'게임 목록',
      coinPop:'+{n}'
    },
    ja: {
      name1:'ブンブン', name2:'ドライブ',
      tagline:'車をよけてコインを拾おう',
      dist:'距離', coin:'コイン', best:'ベスト',
      readyTitle:'準備はいい？',
      readyBody:'対向車をよけながら<br>コインを拾うとスコアが上がるよ。',
      start:'スタート',
      overTitle:'ガシャン！',
      retry:'もう一度',
      paused:'一時停止',
      pausedHint:'Pキーをもう一度押すと続きます。',
      resume:'つづける',
      padLeft:'左へ', padRight:'右へ',
      help:'← → キーを押す · 画面の左右をタップ · Pで一時停止',
      allGames:'ゲーム一覧',
      coinPop:'+{n}'
    },
    es: {
      name1:'Carrera', name2:'Vroom',
      tagline:'Esquiva coches y junta monedas.',
      dist:'Dist.', coin:'Monedas', best:'Récord',
      readyTitle:'¿Listo?',
      readyBody:'Esquiva los coches que vienen<br>y junta monedas para sumar puntos.',
      start:'Empezar',
      overTitle:'¡Choque!',
      retry:'Otra vez',
      paused:'En pausa',
      pausedHint:'Pulsa P otra vez para seguir.',
      resume:'Continuar',
      padLeft:'Izquierda', padRight:'Derecha',
      help:'Mantén ← → · Toca a los lados de la pantalla · P para pausar',
      allGames:'Todos los juegos',
      coinPop:'+{n}'
    },
    fr: {
      name1:'Balade', name2:'Vroum',
      tagline:'Évite les voitures et ramasse les pièces.',
      dist:'Dist.', coin:'Pièces', best:'Record',
      readyTitle:'Prêt ?',
      readyBody:'Évite les voitures en face<br>et ramasse des pièces pour marquer des points.',
      start:'Commencer',
      overTitle:'Crash !',
      retry:'Rejouer',
      paused:'En pause',
      pausedHint:'Appuie encore sur P pour continuer.',
      resume:'Reprendre',
      padLeft:'Gauche', padRight:'Droite',
      help:"Maintiens ← → · Touche l'écran à gauche ou à droite · P pour pause",
      allGames:'Tous les jeux',
      coinPop:'+{n}'
    },
    zh: {
      name1:'嗡嗡', name2:'兜风',
      tagline:'躲避汽车，收集金币',
      dist:'距离', coin:'金币', best:'最高',
      readyTitle:'准备好了吗？',
      readyBody:'躲开迎面而来的车<br>捡金币可以加分。',
      start:'开始',
      overTitle:'撞车了！',
      retry:'再玩一次',
      paused:'暂停',
      pausedHint:'再按一次 P 继续。',
      resume:'继续',
      padLeft:'向左', padRight:'向右',
      help:'按 ← → 键 · 点屏幕左右两边 · 按 P 暂停',
      allGames:'全部游戏',
      coinPop:'+{n}'
    }
  };

  function pickLang(){
    const q = new URLSearchParams(location.search).get('lang');
    if (q && LANGS.includes(q)) return q;
    try {
      const saved = localStorage.getItem('arcadeLang');
      if (saved && LANGS.includes(saved)) return saved;
    } catch (e) {}
    const want = navigator.languages || [navigator.language || 'en'];
    for (const raw of want) {
      const s = String(raw).toLowerCase();
      for (const l of LANGS) if (s.startsWith(l)) return l;
    }
    return 'en';
  }

  let lang = pickLang();
  function t(k){ return (STR[lang] && STR[lang][k]) || STR.en[k] || k; }

  const sel = document.getElementById('lang');
  for (const l of LANGS) {
    const o = document.createElement('option');
    o.value = l; o.textContent = LANG_NAME[l];
    sel.appendChild(o);
  }

  const back = document.getElementById('back');
  const padL = document.getElementById('padL');
  const padR = document.getElementById('padR');

  function esc(s){
    return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  }

  function apply(){
    document.documentElement.lang = lang;
    sel.value = lang;

    document.getElementById('gameName').innerHTML =
      esc(t('name1')) + ' <span>' + esc(t('name2')) + '</span>';
    document.title = t('name1') + ' ' + t('name2');

    for (const el of document.querySelectorAll('[data-i18n]'))
      el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-html]'))
      el.innerHTML = t(el.dataset.i18nHtml);

    padL.setAttribute('aria-label', t('padLeft'));
    padR.setAttribute('aria-label', t('padRight'));

    back.href = '/?lang=' + lang;
  }

  sel.addEventListener('change', () => {
    lang = sel.value;
    try { localStorage.setItem('arcadeLang', lang); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('lang', lang);
    history.replaceState(null, '', u);
    apply();
  });

  apply();

  // ── 게임 ────────────────────────────────────────────
  const W = 360, H = 620;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);

  // ── 색 ─────────────────────────────────────────────
  const C = {
    ink:'#2A3145', road:'#59637A', roadDark:'#4B5468', dash:'#FFF1C1',
    grass:'#8FD9A8', grassDeep:'#6BC48A', cream:'#FFF7EA',
    sun:'#FFD23F', coral:'#FF7A6B', glass:'#CFE7FF'
  };
  const FOE = ['#FF7A6B','#7FB8FF','#B79BFF','#FF9ECF','#7FD8C8','#FFA45B'];

  // ── 길 ─────────────────────────────────────────────
  const ROAD_L = 60, ROAD_R = 300;
  const LANES = [100, 180, 260];
  const PLAYER_Y = H - 112;
  const CAR_W = 52, CAR_H = 88;

  // ── 상태 ───────────────────────────────────────────
  let state = 'ready';
  let lane, carX, speed, dist, coins, elapsed;
  let foes, gems, parts, bushes;
  let dashOff, spawnGap, gemGap, shake, blinkT, lastPair, tilt;
  let best = 0;

  function reset(){
    lane = 1; carX = LANES[1];
    speed = 250; dist = 0; coins = 0; elapsed = 0;
    foes = []; gems = []; parts = [];
    dashOff = 0; spawnGap = 300; gemGap = 520;
    shake = 0; blinkT = 2.4; lastPair = false; tilt = 0;
    bushes = [];
    for (let i = 0; i < 14; i++) {
      bushes.push({
        x: Math.random() < .5 ? 8 + Math.random()*40 : 312 + Math.random()*40,
        y: Math.random() * H,
        r: 9 + Math.random()*7,
        c: Math.random() < .25 ? C.sun : C.grassDeep
      });
    }
  }
  reset();

  // ── 최고 기록 (저장 안 되면 이번 판만 기억) ──────────
  (async () => {
    try {
      const r = await window.storage.get('best');
      if (r && r.value) { best = parseInt(r.value, 10) || 0; hBest.textContent = best; }
    } catch (e) { /* 저장소 없음 — 그냥 넘어감 */ }
  })();
  async function saveBest(v){
    try { await window.storage.set('best', String(v)); } catch (e) {}
  }

  // ── 그리기 도구 ────────────────────────────────────
  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function fillStroke(fill, lw){
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw || 3; ctx.strokeStyle = C.ink; ctx.stroke();
  }

  // dir: -1 = 위를 보는 내 차, 1 = 아래로 오는 차
  function drawCar(cx, cy, color, dir, face, rot){
    const x = -CAR_W/2, y = -CAR_H/2;
    ctx.save();
    ctx.translate(cx, cy);
    if (rot) ctx.rotate(rot);

    // 그림자
    ctx.globalAlpha = .16;
    ctx.fillStyle = '#1B2030';
    rr(x + 4, y + 8, CAR_W, CAR_H, 15); ctx.fill();
    ctx.globalAlpha = 1;

    // 바퀴
    ctx.fillStyle = '#333A4D';
    rr(x - 5, y + 14, 9, 22, 4); ctx.fill();
    rr(x + CAR_W - 4, y + 14, 9, 22, 4); ctx.fill();
    rr(x - 5, y + CAR_H - 36, 9, 22, 4); ctx.fill();
    rr(x + CAR_W - 4, y + CAR_H - 36, 9, 22, 4); ctx.fill();

    // 몸통
    rr(x, y, CAR_W, CAR_H, 15);
    fillStroke(color, 3.5);

    // 앞유리 (앞쪽에)
    const wy = dir < 0 ? y + 14 : y + CAR_H - 36;
    rr(x + 8, wy, CAR_W - 16, 22, 8);
    fillStroke(C.glass, 2.5);

    // 뒷유리
    const by = dir < 0 ? y + CAR_H - 30 : y + 8;
    ctx.globalAlpha = .75;
    rr(x + 11, by, CAR_W - 22, 16, 7);
    fillStroke(C.glass, 2.5);
    ctx.globalAlpha = 1;

    // 전조등
    const ly = dir < 0 ? y + 4 : y + CAR_H - 11;
    ctx.fillStyle = '#FFF6C9';
    rr(x + 7, ly, 12, 7, 3); ctx.fill();
    rr(x + CAR_W - 19, ly, 12, 7, 3); ctx.fill();

    // 얼굴 (내 차만)
    if (face) {
      const ey = y + 30, open = face.open;
      for (const ex of [x + 17, x + CAR_W - 17]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(ex, ey, 7, 7 * open + .6, 0, 0, 6.284);
        ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
        if (open > .35) {
          ctx.fillStyle = C.ink;
          ctx.beginPath();
          ctx.arc(ex + face.look * 2.4, ey + 1, 3.1, 0, 6.284);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  function drawCoin(cx, cy, t){
    const s = Math.abs(Math.cos(t));
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(.35 + s * .65, 1);
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.284);
    fillStroke(C.sun, 3);
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, 6.284);
    ctx.lineWidth = 2.4; ctx.strokeStyle = 'rgba(42,49,69,.45)'; ctx.stroke();
    ctx.restore();
  }

  function puff(x, y, n, color){
    for (let i = 0; i < n; i++) {
      parts.push({
        x, y,
        vx: (Math.random() - .5) * 150,
        vy: (Math.random() - .5) * 150 - 40,
        r: 4 + Math.random() * 9,
        life: .5 + Math.random() * .5, max: 1,
        c: color
      });
    }
  }
  function popText(x, y, txt){
    parts.push({ x, y, vx: 0, vy: -60, txt, life: .8, max: .8, c: C.sun });
  }

  // ── 움직임 ─────────────────────────────────────────
  function move(d){
    if (state !== 'play') return;
    const n = Math.max(0, Math.min(2, lane + d));
    if (n !== lane) { lane = n; tilt = d * .16; }
  }

  function spawnFoes(){
    let pair = !lastPair && elapsed > 14 && Math.random() < .34;
    const order = [0, 1, 2].sort(() => Math.random() - .5);
    const use = order.slice(0, pair ? 2 : 1);
    for (const l of use) {
      foes.push({
        lane: l, x: LANES[l], y: -CAR_H,
        c: FOE[(Math.random() * FOE.length) | 0],
        rel: 20 + Math.random() * 55
      });
    }
    lastPair = pair;
  }

  function spawnGems(){
    const l = (Math.random() * 3) | 0;
    const busy = foes.some(f => f.lane === l && f.y < 40);
    if (busy) return;
    for (let i = 0; i < 3; i++) gems.push({ x: LANES[l], y: -30 - i * 44, t: Math.random() * 3 });
  }

  function crash(){
    state = 'over';
    shake = reduce ? 0 : 14;
    puff(carX, PLAYER_Y - 20, 16, '#EEF2F7');
    puff(carX, PLAYER_Y - 20, 8, C.coral);
    const total = Math.floor(dist / 10) + coins * 10;
    if (total > best) { best = total; hBest.textContent = best; saveBest(best); }
    rDist.textContent = Math.floor(dist / 10);
    rCoin.textContent = coins;
    show('scOver');
  }

  // ── 업데이트 ───────────────────────────────────────
  function update(dt){
    blinkT -= dt;
    if (blinkT < -.14) blinkT = 2 + Math.random() * 2.6;
    tilt *= Math.pow(.001, dt);
    shake *= Math.pow(.02, dt);

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= .94; p.vy *= .94;
      if (p.life <= 0) parts.splice(i, 1);
    }

    // 준비 화면에서는 길만 천천히 흐른다
    if (state !== 'play') {
      if (state === 'ready') {
        dashOff = (dashOff + 60 * dt) % 56;
        for (const b of bushes) { b.y += 60 * dt; if (b.y > H + 20) b.y = -20; }
      }
      return;
    }

    elapsed += dt;
    speed = Math.min(560, 250 + elapsed * 11);
    const dy = speed * dt;
    dist += dy;
    dashOff = (dashOff + dy) % 56;

    for (const b of bushes) {
      b.y += dy;
      if (b.y > H + 20) {
        b.y = -20;
        b.x = Math.random() < .5 ? 8 + Math.random() * 40 : 312 + Math.random() * 40;
      }
    }

    carX += (LANES[lane] - carX) * Math.min(1, dt * 14);

    // 다른 차
    spawnGap -= dy;
    if (spawnGap <= 0) {
      spawnFoes();
      const f = Math.max(.62, .95 - elapsed * .004);
      spawnGap = speed * f + Math.random() * 80;
    }
    for (let i = foes.length - 1; i >= 0; i--) {
      const f = foes[i];
      f.y += (speed + f.rel) * dt;
      if (f.y > H + CAR_H) { foes.splice(i, 1); continue; }
      if (Math.abs(f.x - carX) < CAR_W - 12 && Math.abs(f.y - PLAYER_Y) < CAR_H - 16) {
        crash(); return;
      }
    }

    // 동전
    gemGap -= dy;
    if (gemGap <= 0) { spawnGems(); gemGap = 700 + Math.random() * 500; }
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      g.y += speed * dt; g.t += dt * 3.4;
      if (g.y > H + 30) { gems.splice(i, 1); continue; }
      if (Math.abs(g.x - carX) < 34 && Math.abs(g.y - PLAYER_Y) < 50) {
        gems.splice(i, 1);
        coins++;
        puff(g.x, g.y, 5, C.sun);
        popText(g.x, g.y - 6, t('coinPop').replace('{n}', 10));
      }
    }

    hDist.textContent = Math.floor(dist / 10);
    hCoin.textContent = coins;
  }

  // ── 화면 ───────────────────────────────────────────
  function draw(){
    ctx.save();
    if (shake > .4) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    // 잔디
    ctx.fillStyle = C.grass;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    for (const b of bushes) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.284);
      ctx.fillStyle = b.c; ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(42,49,69,.35)'; ctx.stroke();
    }

    // 길
    ctx.fillStyle = C.road;
    ctx.fillRect(ROAD_L, -20, ROAD_R - ROAD_L, H + 40);
    ctx.fillStyle = C.roadDark;
    ctx.fillRect(ROAD_L, -20, 8, H + 40);
    ctx.fillRect(ROAD_R - 8, -20, 8, H + 40);

    // 갓길 선
    ctx.fillStyle = C.cream;
    ctx.fillRect(ROAD_L + 11, -20, 4, H + 40);
    ctx.fillRect(ROAD_R - 15, -20, 4, H + 40);

    // 가운데 점선
    ctx.fillStyle = C.dash;
    for (const x of [138, 218]) {
      for (let y = -56 + dashOff; y < H + 56; y += 56) {
        rr(x, y, 6, 30, 3); ctx.fill();
      }
    }

    for (const g of gems) drawCoin(g.x, g.y, g.t);
    for (const f of foes) drawCar(f.x, f.y, f.c, 1, null, 0);

    if (state !== 'over') {
      const open = blinkT < 0 ? .06 : 1;
      const look = (LANES[lane] - carX) / -70;
      drawCar(carX, PLAYER_Y, C.sun, -1, { open, look: Math.max(-1, Math.min(1, look)) }, reduce ? 0 : tilt);
    } else {
      drawCar(carX, PLAYER_Y, C.sun, -1, { open: .06, look: 0 }, .35);
    }

    for (const p of parts) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.txt) {
        ctx.fillStyle = C.cream;
        ctx.font = '900 20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
        ctx.strokeText(p.txt, p.x, p.y);
        ctx.fillText(p.txt, p.x, p.y);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, 6.284);
        ctx.fillStyle = p.c; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  let last = 0;
  function frame(t){
    const dt = Math.min((t - last) / 1000, .05);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── 조작 ───────────────────────────────────────────
  const scReady = document.getElementById('scReady');
  const scOver = document.getElementById('scOver');
  const scPause = document.getElementById('scPause');
  const hDist = document.getElementById('hDist');
  const hCoin = document.getElementById('hCoin');
  const hBest = document.getElementById('hBest');
  const rDist = document.getElementById('rDist');
  const rCoin = document.getElementById('rCoin');

  function show(id){
    for (const s of [scReady, scOver, scPause]) s.classList.toggle('on', s.id === id);
  }
  function hideAll(){ show('none'); }

  function start(){
    reset();
    hDist.textContent = '0'; hCoin.textContent = '0';
    state = 'play';
    hideAll();
  }
  function togglePause(){
    if (state === 'play') { state = 'pause'; show('scPause'); }
    else if (state === 'pause') { state = 'play'; hideAll(); }
  }

  document.getElementById('btnStart').onclick = start;
  document.getElementById('btnRetry').onclick = start;
  document.getElementById('btnResume').onclick = togglePause;
  document.getElementById('padL').onclick = () => move(-1);
  document.getElementById('padR').onclick = () => move(1);

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowleft','arrowright',' ','arrowup','arrowdown'].includes(k)) e.preventDefault();
    if (k === 'arrowleft' || k === 'a') move(-1);
    else if (k === 'arrowright' || k === 'd') move(1);
    else if (k === 'p') togglePause();
    else if (k === ' ' || k === 'enter') {
      if (state === 'ready' || state === 'over') start();
    }
  });

  cv.addEventListener('pointerdown', e => {
    if (state === 'ready' || state === 'over') { start(); return; }
    const r = cv.getBoundingClientRect();
    move(e.clientX - r.left < r.width / 2 ? -1 : 1);
  });
})();
</script>
</body>
