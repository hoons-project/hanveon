<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merge Fruit</title>
<meta name="description" content="Drop fruit and merge matching pairs into bigger ones. A tiny browser game — no install, just play.">
<meta name="theme-color" content="#FFF7EA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --ink:#2A3145;
    --cream:#FFF7EA;
    --peach:#FFD9B8;
    --sun:#FFD23F;
    --coral:#FF7A6B;
    --grape:#9B7FE0;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:
      radial-gradient(circle at 12% 8%, #FFFFFF 0 3px, transparent 3px) 0 0/26px 26px,
      var(--peach);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
  }

  .cabinet{
    width:100%;
    max-width:392px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:28px;
    box-shadow:8px 8px 0 var(--ink);
    padding:14px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:2px 4px 14px;
  }
  .ttl{min-width:0}
  h1{margin:0 0 3px;font-size:24px;font-weight:900;letter-spacing:-0.03em;word-break:keep-all}
  h1 span{color:var(--coral)}
  .tag{font-size:12.5px;font-weight:700;color:#7A8296;letter-spacing:-0.01em;line-height:1.45}

  .lang{
    flex:none;
    font-family:inherit;font-size:12px;font-weight:800;
    color:var(--ink);background:#fff;
    border:3px solid var(--ink);border-radius:12px;
    padding:7px 8px;cursor:pointer;
    box-shadow:0 3px 0 var(--ink);
  }
  .lang:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

  .hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .hud div{
    background:#fff;
    border:3px solid var(--ink);
    border-radius:14px;
    padding:6px 8px 7px;
    text-align:center;
  }
  .hud b{display:block;font-size:11px;font-weight:800;color:#7A8296;letter-spacing:0.02em}
  .hud i{
    display:block;font-style:normal;font-size:19px;font-weight:900;
    font-variant-numeric:tabular-nums;letter-spacing:-0.02em;
  }
  .hud i.word{font-size:16px}

  .stage{position:relative}
  canvas{
    display:block;
    width:100%;
    aspect-ratio:360/620;
    border:4px solid var(--ink);
    border-radius:20px;
    background:#FFE8D2;
    touch-action:none;
    cursor:pointer;
  }

  .screen{
    position:absolute;inset:0;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;border-radius:20px;
    background:rgba(42,49,69,.62);
    backdrop-filter:blur(2px);
  }
  .screen.on{display:flex}
  .card{
    width:100%;max-width:262px;
    background:var(--cream);
    border:4px solid var(--ink);
    border-radius:22px;
    box-shadow:6px 6px 0 rgba(0,0,0,.28);
    padding:20px 18px;
  }
  .card h2{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:-0.04em}
  .card p{margin:0 0 14px;font-size:13px;line-height:1.55;color:#5C6479;font-weight:600}
  .result{display:flex;justify-content:center;gap:18px;margin:2px 0 14px}
  .result span{font-size:12px;font-weight:800;color:#7A8296;display:block}
  .result strong{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
  .result strong.word{font-size:18px}

  .chain{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:5px;margin:0 0 16px;
  }
  .chain i{
    display:block;border:2.5px solid var(--ink);border-radius:50%;
  }
  .chain u{text-decoration:none;font-size:11px;font-weight:800;color:#9AA1B2}

  button{
    font-family:inherit;font-weight:900;font-size:16px;letter-spacing:-0.02em;
    color:var(--ink);background:var(--sun);
    border:3px solid var(--ink);border-radius:14px;
    padding:11px 22px;cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
    transition:transform .06s, box-shadow .06s;
  }
  button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

  .pad{display:flex;gap:10px;margin-top:12px}
  .pad button{flex:1;background:#fff;font-size:22px;padding:12px 0}
  .pad button.drop{background:var(--sun);font-size:16px;flex:1.2}

  .help{
    margin:10px 2px 0;font-size:12px;line-height:1.6;
    font-weight:600;color:#7A8296;text-align:center;
  }

  .backwrap{margin:12px 0 0;text-align:center}
  .back{font-size:12px;font-weight:800;color:#7A8296;text-decoration:none}
  .back:hover{color:var(--ink)}

  @media (hover:hover){ .pad{display:none} }
</style>
</head>
<body>

<div class="cabinet">
  <header>
    <div class="ttl">
      <h1 id="gameName">Merge <span>Fruit</span></h1>
      <div class="tag" data-i18n="tagline">Match two, grow bigger.</div>
    </div>
    <select id="lang" aria-label="Language" class="lang"></select>
  </header>

  <div class="hud">
    <div><b data-i18n="score">Score</b><i id="hScore">0</i></div>
    <div><b data-i18n="big">Biggest</b><i id="hBig" class="word">Pea</i></div>
    <div><b data-i18n="best">Best</b><i id="hBest">0</i></div>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>

    <div class="screen on" id="scReady">
      <div class="card">
        <h2 data-i18n="readyTitle">Fill It Up</h2>
        <p data-i18n-html="readyBody">Drop the fruit in.<br>When two match touch,<br>they merge into one bigger fruit.</p>
        <div class="chain" id="chain"></div>
        <button id="btnStart" data-i18n="start">Start</button>
      </div>
    </div>

    <div class="screen" id="scOver">
      <div class="card">
        <h2 data-i18n="overTitle">Overflow!</h2>
        <div class="result">
          <div><span data-i18n="score">Score</span><strong id="rScore">0</strong></div>
          <div><span data-i18n="big">Biggest</span><strong id="rBig" class="word">Pea</strong></div>
        </div>
        <button id="btnRetry" data-i18n="retry">Play Again</button>
      </div>
    </div>

    <div class="screen" id="scPause">
      <div class="card">
        <h2 data-i18n="paused">Paused</h2>
        <p data-i18n="pausedHint">Press P again to keep going.</p>
        <button id="btnResume" data-i18n="resume">Resume</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button id="padL" aria-label="Left">◀</button>
    <button id="padDrop" class="drop" data-i18n="padDrop">Drop</button>
    <button id="padR" aria-label="Right">▶</button>
  </div>

  <p class="help" data-i18n-html="help">Tap to pick a spot, let go to drop<br>← → move · Space drop · P pause</p>

  <p class="backwrap"><a class="back" id="back" href="/">‹ <span data-i18n="allGames">All games</span></a></p>
</div>

<script>
(() => {
  // ── 언어 ────────────────────────────────────────────
  const LANGS = ['en','ko','ja','es','fr','zh'];
  const LANG_NAME = {
    en:'English', ko:'한국어', ja:'日本語',
    es:'Español', fr:'Français', zh:'中文'
  };

  const STR = {
    en: {
      name1:'Merge', name2:'Fruit',
      tagline:'Match two, grow bigger.',
      score:'Score', big:'Biggest', best:'Best',
      readyTitle:'Fill It Up',
      readyBody:'Drop the fruit in.<br>When two match touch,<br>they merge into one bigger fruit.',
      start:'Start',
      overTitle:'Overflow!',
      retry:'Play Again',
      paused:'Paused',
      pausedHint:'Press P again to keep going.',
      resume:'Resume',
      padLeft:'Left', padRight:'Right', padDrop:'Drop',
      help:'Tap to pick a spot, let go to drop<br>← → move · Space drop · P pause',
      allGames:'All games',
      next:'Next',
      fruits:['Pea','Cherry','Grape','Mandarin','Lemon','Apple','Pear','Peach','Pineapple','Melon','Watermelon']
    },
    ko: {
      name1:'몽글', name2:'과일',
      tagline:'같은 것끼리 닿으면 커져요',
      score:'점수', big:'가장 큰 것', best:'최고',
      readyTitle:'통에 담아요',
      readyBody:'과일을 떨어뜨려요.<br>같은 과일끼리 닿으면<br>더 큰 과일 하나로 합쳐져요.',
      start:'시작',
      overTitle:'넘쳤다!',
      retry:'다시 하기',
      paused:'잠깐 멈춤',
      pausedHint:'P 키를 다시 누르면 이어서 해요.',
      resume:'이어 하기',
      padLeft:'왼쪽으로', padRight:'오른쪽으로', padDrop:'놓기',
      help:'화면을 눌러 자리 고르고, 떼면 떨어져요<br>← → 옮기기 · 스페이스 놓기 · P 멈춤',
      allGames:'게임 목록',
      next:'다음',
      fruits:['완두','체리','포도','귤','레몬','사과','배','복숭아','파인애플','멜론','수박']
    },
    ja: {
      name1:'もぐもぐ', name2:'フルーツ',
      tagline:'同じ果物をくっつけて大きくしよう',
      score:'スコア', big:'最大', best:'ベスト',
      readyTitle:'びんにためよう',
      readyBody:'果物を落とすよ。<br>同じ果物がくっつくと<br>もっと大きな一つになるよ。',
      start:'スタート',
      overTitle:'あふれた！',
      retry:'もう一度',
      paused:'一時停止',
      pausedHint:'Pキーをもう一度押すと続きます。',
      resume:'つづける',
      padLeft:'左へ', padRight:'右へ', padDrop:'落とす',
      help:'画面をタップして場所を決めて、離すと落ちるよ<br>← → で移動 · スペースで落とす · Pで一時停止',
      allGames:'ゲーム一覧',
      next:'つぎ',
      fruits:['エンドウ','さくらんぼ','ぶどう','みかん','レモン','りんご','なし','もも','パイナップル','メロン','すいか']
    },
    es: {
      name1:'Fusión', name2:'Frutal',
      tagline:'Junta dos iguales y crecen.',
      score:'Puntos', big:'Mayor', best:'Récord',
      readyTitle:'¡Llena el bote!',
      readyBody:'Deja caer la fruta.<br>Si dos iguales se tocan,<br>se unen en una más grande.',
      start:'Empezar',
      overTitle:'¡Se desbordó!',
      retry:'Otra vez',
      paused:'En pausa',
      pausedHint:'Pulsa P otra vez para seguir.',
      resume:'Continuar',
      padLeft:'Izquierda', padRight:'Derecha', padDrop:'Soltar',
      help:'Toca para elegir el lugar, suelta para caer<br>← → mover · Espacio soltar · P pausa',
      allGames:'Todos los juegos',
      next:'Sig.',
      fruits:['Guisante','Cereza','Uva','Mandarina','Limón','Manzana','Pera','Melocotón','Piña','Melón','Sandía']
    },
    fr: {
      name1:'Fusion', name2:'Fruitée',
      tagline:'Associe deux fruits pareils, ils grossissent.',
      score:'Score', big:'Plus gros', best:'Record',
      readyTitle:'Remplis le pot !',
      readyBody:'Laisse tomber les fruits.<br>Deux fruits pareils qui se touchent<br>fusionnent en un plus gros.',
      start:'Commencer',
      overTitle:'Ça déborde !',
      retry:'Rejouer',
      paused:'En pause',
      pausedHint:'Appuie encore sur P pour continuer.',
      resume:'Reprendre',
      padLeft:'Gauche', padRight:'Droite', padDrop:'Lâcher',
      help:"Touche pour choisir l'endroit, relâche pour lâcher<br>← → déplacer · Espace lâcher · P pause",
      allGames:'Tous les jeux',
      next:'Suiv.',
      fruits:['Petit pois','Cerise','Raisin','Mandarine','Citron','Pomme','Poire','Pêche','Ananas','Melon','Pastèque']
    },
    zh: {
      name1:'圆滚', name2:'水果',
      tagline:'碰到一样的就会变大',
      score:'分数', big:'最大', best:'最高',
      readyTitle:'装满罐子',
      readyBody:'把水果放下去。<br>两个一样的碰到一起，<br>就会合成更大的一个。',
      start:'开始',
      overTitle:'溢出了！',
      retry:'再玩一次',
      paused:'暂停',
      pausedHint:'再按一次 P 继续。',
      resume:'继续',
      padLeft:'向左', padRight:'向右', padDrop:'放下',
      help:'点屏幕选位置，松开就会掉下去<br>← → 移动 · 空格放下 · P 暂停',
      allGames:'全部游戏',
      next:'下一个',
      fruits:['豌豆','樱桃','葡萄','橘子','柠檬','苹果','梨','桃子','菠萝','甜瓜','西瓜']
    }
  };

  function pickLang(){
    const q = new URLSearchParams(location.search).get('lang');
    if (q && LANGS.includes(q)) return q;
    try {
      const saved = localStorage.getItem('arcadeLang');
      if (saved && LANGS.includes(saved)) return saved;
    } catch (e) {}
    const want = navigator.languages || [navigator.language || 'en'];
    for (const raw of want) {
      const s = String(raw).toLowerCase();
      for (const l of LANGS) if (s.startsWith(l)) return l;
    }
    return 'en';
  }

  let lang = pickLang();
  function t(k){ return (STR[lang] && STR[lang][k]) || STR.en[k] || k; }

  const sel = document.getElementById('lang');
  for (const l of LANGS) {
    const o = document.createElement('option');
    o.value = l; o.textContent = LANG_NAME[l];
    sel.appendChild(o);
  }

  const back = document.getElementById('back');
  const padL = document.getElementById('padL');
  const padR = document.getElementById('padR');

  function esc(s){
    return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
  }

  function apply(){
    document.documentElement.lang = lang;
    sel.value = lang;

    document.getElementById('gameName').innerHTML =
      esc(t('name1')) + ' <span>' + esc(t('name2')) + '</span>';
    document.title = t('name1') + ' ' + t('name2');

    for (const el of document.querySelectorAll('[data-i18n]'))
      el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-html]'))
      el.innerHTML = t(el.dataset.i18nHtml);

    padL.setAttribute('aria-label', t('padLeft'));
    padR.setAttribute('aria-label', t('padRight'));

    back.href = '/?lang=' + lang;

    // 과일 이름 — 통 안 상황(HUD/결과/합체 순서)은 언어 바뀌어도 그대로
    document.getElementById('hBig').textContent = t('fruits')[bigTier];
    document.getElementById('rBig').textContent = t('fruits')[bigTier];
    buildChain();
  }

  sel.addEventListener('change', () => {
    lang = sel.value;
    try { localStorage.setItem('arcadeLang', lang); } catch (e) {}
    const u = new URL(location.href);
    u.searchParams.set('lang', lang);
    history.replaceState(null, '', u);
    apply();
  });

  // ── 게임 ────────────────────────────────────────────
  const W = 360, H = 620;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  addEventListener('resize', fit);

  const INK = '#2A3145';

  // ── 과일 목록 ───────────────────────────────────────
  const FRUIT = [
    { r:13, c:'#8FD14F', d:'#6FB334' },
    { r:18, c:'#FF6B7A', d:'#E14A5B' },
    { r:23, c:'#9B7FE0', d:'#7C5FC4' },
    { r:29, c:'#FF9F45', d:'#E07E24' },
    { r:35, c:'#FFE066', d:'#E7C233' },
    { r:42, c:'#EF4B4B', d:'#CB2F2F' },
    { r:51, c:'#DCE07A', d:'#BCC155' },
    { r:61, c:'#FFB0C4', d:'#E88BA2' },
    { r:72, c:'#F2A93B', d:'#D08B22' },
    { r:84, c:'#B8E3A0', d:'#93C67A' },
    { r:97, c:'#3FA95B', d:'#2C8544' }
  ];
  const TOP = FRUIT.length - 1;
  const BAG = [0,0,0,1,1,1,2,2,3];      // 처음에 나오는 과일

  // ── 통 ──────────────────────────────────────────────
  const BOX = { l:32, r:328, b:596, t:206 };   // 안쪽 기준
  const DROP_Y = 128;
  const WALL = 7;

  // ── 물리 값 ─────────────────────────────────────────
  const G = 2100;          // 중력
  const REST = 0.08;       // 튕김
  const WALL_REST = 0.15;
  const AIR = 0.9995;
  const FRICT = 0.985;

  let balls, parts, score, best = 0, bigTier, state;
  let aim, cur, next, cooldown, comboT, combo, shake;
  let overT;

  function pick(){ return BAG[(Math.random() * BAG.length) | 0]; }

  function reset(){
    balls = []; parts = [];
    score = 0; bigTier = 0; state = 'ready';
    aim = W/2; cur = pick(); next = pick();
    cooldown = 0; comboT = 0; combo = 0; shake = 0; overT = 0;
  }

  function addBall(x, y, tier, vx, vy, landed){
    balls.push({
      x, y, tier, r: FRUIT[tier].r,
      m: FRUIT[tier].r * FRUIT[tier].r,
      vx: vx || 0, vy: vy || 0,
      landed: !!landed, over: 0, pop: 0, born: 0
    });
    return balls[balls.length - 1];
  }

  // ── 조작 ────────────────────────────────────────────
  function clampAim(){
    const r = FRUIT[cur].r;
    aim = Math.max(BOX.l + r, Math.min(BOX.r - r, aim));
  }

  function drop(){
    if (state !== 'play' || cooldown > 0) return;
    clampAim();
    addBall(aim, DROP_Y, cur, 0, 120, false);
    cur = next; next = pick();
    clampAim();
    cooldown = 0.42;
  }

  // ── 합치기 ──────────────────────────────────────────
  function merge(a, b){
    const t = a.tier;
    const x = (a.x * a.m + b.x * b.m) / (a.m + b.m);
    const y = (a.y * a.m + b.y * b.m) / (a.m + b.m);

    a.gone = true; b.gone = true;

    combo = comboT > 0 ? combo + 1 : 1;
    comboT = 0.85;

    const base = (t + 1) * (t + 2) / 2;
    const gain = base * combo;
    score += gain;

    if (t + 1 <= TOP) {
      const nb = addBall(x, y, t + 1, (a.vx + b.vx) * .3, Math.min(a.vy, b.vy) * .3 - 60, true);
      nb.pop = 1;
      if (t + 1 > bigTier) bigTier = t + 1;
      if (t + 1 === TOP) shake = Math.max(shake, 9);
    } else {
      // 수박 두 개 — 둘 다 사라지고 큰 점수
      score += 300;
      shake = Math.max(shake, 14);
      if (!reduce) puff(x, y, 22, FRUIT[TOP].c, 90);
    }

    if (!reduce) puff(x, y, 9 + t, FRUIT[t].c, 40 + t * 6);
    popText(x, y - FRUIT[t].r - 6, combo > 1 ? '+' + gain + ' x' + combo : '+' + gain);
  }

  function puff(x, y, n, c, spread){
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.284, s = (spread || 60) * (.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 30,
                   r: 3 + Math.random()*6, life:.35 + Math.random()*.45, max:.8, c });
    }
  }
  function popText(x, y, txt){
    parts.push({ x, y, vx:0, vy:-70, txt, life:.85, max:.85 });
  }

  // ── 한 걸음 ─────────────────────────────────────────
  function step(h){
    for (const b of balls) {
      b.born += h;
      b.vy += G * h;
      b.vx *= AIR; b.vy *= AIR;
      b.x += b.vx * h;
      b.y += b.vy * h;
    }

    for (let pass = 0; pass < 3; pass++) {
      // 과일끼리
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (a.gone) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (b.gone) continue;
          let dx = b.x - a.x, dy = b.y - a.y;
          let d2 = dx*dx + dy*dy;
          const rr = a.r + b.r;
          if (d2 >= rr*rr || d2 === 0) continue;

          let d = Math.sqrt(d2);
          const nx = dx/d, ny = dy/d;

          if (a.tier === b.tier) { merge(a, b); break; }

          a.landed = true; b.landed = true;

          const ov = rr - d;
          const im = 1/a.m + 1/b.m;
          const ca = (1/a.m) / im, cb = (1/b.m) / im;
          a.x -= nx * ov * ca * .8; a.y -= ny * ov * ca * .8;
          b.x += nx * ov * cb * .8; b.y += ny * ov * cb * .8;

          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx*nx + rvy*ny;
          if (vn < 0) {
            const jimp = -(1 + REST) * vn / im;
            a.vx -= jimp * nx / a.m; a.vy -= jimp * ny / a.m;
            b.vx += jimp * nx / b.m; b.vy += jimp * ny / b.m;
          }
          // 미끄럼 줄이기
          const tx = -ny, ty = nx;
          const vt = (b.vx - a.vx)*tx + (b.vy - a.vy)*ty;
          const jt = -vt * .12 / im;
          a.vx -= jt * tx / a.m; a.vy -= jt * ty / a.m;
          b.vx += jt * tx / b.m; b.vy += jt * ty / b.m;
        }
      }

      // 벽과 바닥
      for (const b of balls) {
        if (b.gone) continue;
        if (b.x - b.r < BOX.l) { b.x = BOX.l + b.r; if (b.vx < 0) b.vx *= -WALL_REST; b.landed = true; }
        if (b.x + b.r > BOX.r) { b.x = BOX.r - b.r; if (b.vx > 0) b.vx *= -WALL_REST; b.landed = true; }
        if (b.y + b.r > BOX.b) {
          b.y = BOX.b - b.r;
          if (b.vy > 0) b.vy *= -WALL_REST;
          b.vx *= FRICT;
          b.landed = true;
        }
      }
    }

    for (let i = balls.length - 1; i >= 0; i--) if (balls[i].gone) balls.splice(i, 1);
  }

  // ── 업데이트 ────────────────────────────────────────
  function update(dt){
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .93; p.vy *= .93;
      if (p.life <= 0) parts.splice(i, 1);
    }
    shake *= Math.pow(.02, dt);
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

    if (state !== 'play') return;

    if (cooldown > 0) cooldown -= dt;

    const sub = 4, h = dt / sub;
    for (let s = 0; s < sub; s++) step(h);

    for (const b of balls) if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 3.2);

    // 넘쳤는지
    let danger = 0;
    for (const b of balls) {
      if (b.landed && b.y - b.r < BOX.t) { b.over += dt; danger = Math.max(danger, b.over); }
      else b.over = 0;
    }
    overT = danger;
    if (danger > 1.5) over();

    hScore.textContent = score;
    hBig.textContent = t('fruits')[bigTier];
  }

  function over(){
    state = 'over';
    if (score > best) { best = score; hBest.textContent = best; saveBest(best); }
    rScore.textContent = score;
    rBig.textContent = t('fruits')[bigTier];
    show('scOver');
  }

  // ── 그리기 ──────────────────────────────────────────
  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawFruit(x, y, tier, pop, plain){
    const f = FRUIT[tier];
    const k = f.r / 11;
    const sq = pop ? 1 + pop * .22 : 1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sq, 2 - sq);

    if (!plain) {
      ctx.globalAlpha = .14; ctx.fillStyle = '#1B2030';
      ctx.beginPath(); ctx.arc(2.5, 4, f.r, 0, 6.284); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 몸
    ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 6.284);
    ctx.fillStyle = f.c; ctx.fill();
    ctx.lineWidth = Math.max(2.4, 3.2 * Math.min(1.4, k)); ctx.strokeStyle = INK; ctx.stroke();

    // 아래쪽 진한 부분
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, f.r, 0, 6.284); ctx.clip();
    ctx.globalAlpha = .35; ctx.fillStyle = f.d;
    ctx.beginPath(); ctx.arc(0, f.r * .85, f.r * .95, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();

    // 반짝임
    ctx.globalAlpha = .55; ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(-f.r*.38, -f.r*.44, f.r*.24, f.r*.16, -.7, 0, 6.284);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 꼭지
    if (tier >= 3) {
      ctx.save();
      ctx.translate(f.r*.18, -f.r + 1);
      ctx.rotate(-.35);
      ctx.beginPath();
      ctx.ellipse(0, -f.r*.12, f.r*.30, f.r*.14, .2, 0, 6.284);
      ctx.fillStyle = '#7FC46A'; ctx.fill();
      ctx.lineWidth = Math.max(2, 2.6 * Math.min(1.3, k)); ctx.strokeStyle = INK; ctx.stroke();
      ctx.restore();
    }

    // 얼굴
    const ex = f.r * .34, ey = -f.r * .06, er = Math.max(1.8, f.r * .105);
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc( ex, ey, er, 0, 6.284); ctx.fill();

    ctx.lineWidth = Math.max(1.6, f.r * .075); ctx.strokeStyle = INK;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, ey + f.r*.10, f.r*.20, .25, Math.PI - .25);
    ctx.stroke();

    ctx.globalAlpha = .45; ctx.fillStyle = '#FF8FA0';
    ctx.beginPath(); ctx.arc(-f.r*.58, f.r*.16, f.r*.13, 0, 6.284); ctx.fill();
    ctx.beginPath(); ctx.arc( f.r*.58, f.r*.16, f.r*.13, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function draw(){
    ctx.save();
    if (shake > .3) ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);

    // 배경
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#FFF1E0'); g.addColorStop(1, '#FFD9B8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // 통 안쪽
    ctx.fillStyle = '#FFFBF2';
    ctx.fillRect(BOX.l, BOX.t - 30, BOX.r - BOX.l, BOX.b - BOX.t + 30);

    // 위험선
    const warn = Math.min(1, overT / 1.5);
    ctx.save();
    ctx.setLineDash([9, 8]);
    ctx.lineWidth = 3;
    ctx.strokeStyle = warn > .01
      ? `rgba(255,90,80,${.45 + .55*Math.abs(Math.sin(performance.now()/160))})`
      : 'rgba(255,122,107,.55)';
    ctx.beginPath();
    ctx.moveTo(BOX.l, BOX.t); ctx.lineTo(BOX.r, BOX.t);
    ctx.stroke();
    ctx.restore();

    // 과일 (통 안쪽만 보이게)
    ctx.save();
    ctx.beginPath();
    ctx.rect(BOX.l, 0, BOX.r - BOX.l, BOX.b);
    ctx.clip();
    for (const b of balls) drawFruit(b.x, b.y, b.tier, b.pop);
    ctx.restore();

    // 통 테두리
    ctx.lineWidth = WALL; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(BOX.l - WALL/2, BOX.t - 34);
    ctx.lineTo(BOX.l - WALL/2, BOX.b + WALL/2 - 14);
    ctx.quadraticCurveTo(BOX.l - WALL/2, BOX.b + WALL/2, BOX.l + 14, BOX.b + WALL/2);
    ctx.lineTo(BOX.r - 14, BOX.b + WALL/2);
    ctx.quadraticCurveTo(BOX.r + WALL/2, BOX.b + WALL/2, BOX.r + WALL/2, BOX.b + WALL/2 - 14);
    ctx.lineTo(BOX.r + WALL/2, BOX.t - 34);
    ctx.stroke();

    // 들고 있는 과일 + 안내선
    if (state === 'play') {
      const f = FRUIT[cur];
      if (cooldown <= 0) {
        ctx.save();
        ctx.setLineDash([5, 7]);
        ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(42,49,69,.28)';
        ctx.beginPath();
        ctx.moveTo(aim, DROP_Y + f.r + 4); ctx.lineTo(aim, BOX.b - 4);
        ctx.stroke();
        ctx.restore();
        drawFruit(aim, DROP_Y, cur, 0);
      }
    }

    // 다음 과일
    ctx.save();
    rr(W - 84, 16, 68, 62, 14);
    ctx.fillStyle = 'rgba(255,255,255,.86)'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    ctx.fillStyle = '#7A8296';
    ctx.font = '800 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t('next'), W - 50, 32);
    ctx.save();
    ctx.translate(W - 50, 56);
    const s = Math.min(1, 17 / FRUIT[next].r);
    ctx.scale(s, s);
    drawFruit(0, 0, next, 0, true);
    ctx.restore();
    ctx.restore();

    // 조각과 글자
    for (const p of parts) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.txt) {
        ctx.font = '900 20px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4.5; ctx.strokeStyle = INK;
        ctx.strokeText(p.txt, p.x, p.y);
        ctx.fillStyle = '#FFF7EA'; ctx.fillText(p.txt, p.x, p.y);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, 6.284);
        ctx.fillStyle = p.c; ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  let last = 0;
  function frame(t){
    const dt = Math.min((t - last)/1000, .034);
    last = t;
    update(dt); draw();
    requestAnimationFrame(frame);
  }

  // ── 화면과 버튼 ─────────────────────────────────────
  const scReady = document.getElementById('scReady');
  const scOver = document.getElementById('scOver');
  const scPause = document.getElementById('scPause');
  const hScore = document.getElementById('hScore');
  const hBig = document.getElementById('hBig');
  const hBest = document.getElementById('hBest');
  const rScore = document.getElementById('rScore');
  const rBig = document.getElementById('rBig');

  function show(id){
    for (const s of [scReady, scOver, scPause]) s.classList.toggle('on', s.id === id);
  }
  function start(){
    reset();
    hScore.textContent = '0'; hBig.textContent = t('fruits')[0];
    state = 'play';
    show('none');
  }
  function togglePause(){
    if (state === 'play') { state = 'pause'; show('scPause'); }
    else if (state === 'pause') { state = 'play'; show('none'); }
  }

  document.getElementById('btnStart').onclick = start;
  document.getElementById('btnRetry').onclick = start;
  document.getElementById('btnResume').onclick = togglePause;

  // 합쳐지는 순서 보여주기
  function buildChain(){
    const box = document.getElementById('chain');
    box.innerHTML = '';
    const names = t('fruits');
    FRUIT.forEach((f, i) => {
      if (i) { const u = document.createElement('u'); u.textContent = '›'; box.appendChild(u); }
      const el = document.createElement('i');
      const size = 11 + i * 1.6;
      el.style.width = el.style.height = size + 'px';
      el.style.background = f.c;
      el.title = names[i];
      box.appendChild(el);
    });
  }

  // 손가락과 마우스
  function aimFrom(e){
    const b = cv.getBoundingClientRect();
    aim = (e.clientX - b.left) / b.width * W;
    clampAim();
  }
  let pressing = false;
  cv.addEventListener('pointerdown', e => {
    if (state === 'ready' || state === 'over') { start(); return; }
    if (state !== 'play') return;
    pressing = true; aimFrom(e);
  });
  cv.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (pressing || e.pointerType === 'mouse') aimFrom(e);
  });
  cv.addEventListener('pointerup', e => {
    if (!pressing) return;
    pressing = false; aimFrom(e); drop();
  });
  for (const ev of ['pointercancel','pointerleave'])
    cv.addEventListener(ev, () => { pressing = false; });

  // 키
  let hold = 0;
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
    if (k === 'p') togglePause();
    if (k === 'arrowleft' || k === 'a') hold = -1;
    if (k === 'arrowright' || k === 'd') hold = 1;
    if (k === ' ' || k === 'enter') {
      if (state === 'ready' || state === 'over') start();
      else drop();
    }
  });
  addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if ((k === 'arrowleft' || k === 'a') && hold === -1) hold = 0;
    if ((k === 'arrowright' || k === 'd') && hold === 1) hold = 0;
  });

  function padHold(el, dir){
    el.addEventListener('pointerdown', e => { e.preventDefault(); hold = dir; });
    for (const ev of ['pointerup','pointerleave','pointercancel'])
      el.addEventListener(ev, () => { if (hold === dir) hold = 0; });
  }
  padHold(padL, -1);
  padHold(padR, 1);
  document.getElementById('padDrop').addEventListener('click', () => {
    if (state === 'ready' || state === 'over') start(); else drop();
  });

  // 키로 옮기기
  setInterval(() => {
    if (hold && state === 'play') { aim += hold * 6; clampAim(); }
  }, 16);

  // ── 최고 기록 ───────────────────────────────────────
  async function saveBest(v){
    try { await window.storage.set('fruitBest', String(v)); return; } catch (e) {}
    try { localStorage.setItem('fruitBest', String(v)); } catch (e) {}
  }
  (async () => {
    let v = null;
    try { const r = await window.storage.get('fruitBest'); if (r && r.value) v = r.value; } catch (e) {}
    if (v === null) { try { v = localStorage.getItem('fruitBest'); } catch (e) {} }
    if (v) { best = parseInt(v, 10) || 0; hBest.textContent = best; }
  })();

  reset();
  apply();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
